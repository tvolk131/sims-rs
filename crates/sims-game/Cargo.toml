[package]
name = "sims-game"
description = "The game: one window that runs a lot and draws it with its people and the live-mode interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sims-audio = { path = "../sims-audio" }
sims-content.workspace = true
sims-core.workspace = true
sims-formats.workspace = true
sims-net.workspace = true
sims-people = { path = "../sims-people" }
sims-render = { path = "../sims-render" }
sims-sim.workspace = true
sims-ui = { path = "../sims-ui" }
sims-vm.workspace = true
softbuffer = "0.4.8"
tokio.workspace = true
winit = "0.30.13"
# Sound output. On macOS it needs no system library, so it is always on;
# elsewhere it is the `sound` feature, so the workspace build and CI need
# no audio library.
cpal = { version = "0.18.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23.2"
cpal = "0.18.2"

[dev-dependencies]
sha2.workspace = true

# The screenshot ratchet prints its skip and its table even when it
# passes, so it runs without the test harness.
[[test]]
name = "ratchet"
harness = false

[features]
sound = ["dep:cpal"]

[lints]
workspace = true

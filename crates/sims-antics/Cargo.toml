[package]
name = "sims-antics"
description = "Clean-room SimAntics compiler, IFF/FAR binary writer, procedural isometric sprite and WAV generators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
encoding_rs.workspace = true
libm.workspace = true
sims-content = { workspace = true, optional = true }
sims-formats.workspace = true
sims-sim = { workspace = true, optional = true }
sims-vm = { workspace = true, optional = true }

[dev-dependencies]
sims-content.workspace = true
sims-core.workspace = true
sims-sim.workspace = true
sims-vm.workspace = true

[features]
default = ["install-catalog", "vm-replay"]
# `lift`'s install catalog: callee arities from the install, resolved with the VM's own
# loader. Pulls in `sims-vm` (and through it networking and storage crates); turn it off
# for compiler-only builds.
install-catalog = ["dep:sims-content", "dep:sims-vm"]
# The equivalence checker confirms every counterexample by running both trees in
# `sims-vm`. Without it nothing is confirmed, so a difference is only ever inconclusive.
vm-replay = ["dep:sims-content", "dep:sims-sim", "dep:sims-vm"]

[lints]
workspace = true

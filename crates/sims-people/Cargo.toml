[package]
name = "sims-people"
description = "Draws the Sims: skeletons, appearances, meshes, skins, skinning and animation playback. Presentation only; reads simulation state and never changes it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sims-content.workspace = true
sims-formats.workspace = true
sims-core.workspace = true
sims-sim.workspace = true
# The lot renderer's camera, for drawing people into its view. One way
# only: sims-render does not depend on this crate.
sims-render = { path = "../sims-render" }
# The viewer's window, and the simulation it can run a lot with, only
# with the `viewer` feature (see src/bin). The library itself reads the
# simulation's state and never runs it.
sims-vm = { workspace = true, optional = true }
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }

[features]
# A small window that plays the people of a house. Off by default, so the
# workspace build and CI need no windowing libraries.
viewer = ["dep:sims-vm", "dep:softbuffer", "dep:winit"]

[[bin]]
name = "people-viewer"
required-features = ["viewer"]

[dev-dependencies]
sha2.workspace = true
sims-vm.workspace = true

[lints]
workspace = true

[object]
name = "Open Floor Lamp"
description = "A clean-room standing floor lamp with toggleable warm light that boosts Room mood."
guid = 0x7F00_0070
price = 110
attributes = 8
init = "Init"
main = "Main"
scripts = ["behavior.antics"]

[sprite]
shape = "floor_lamp"
primary_rgb = [242, 224, 174]
accent_rgb = [252, 240, 206]
trim_rgb = [116, 94, 62]

[[interaction]]
name = "Turn On Light"
action = "TurnOnLamp"
guard = "CanTurnOnLamp"
autonomy = 40
attenuation = 0.02
motives = [
    { motive = "room", min = -100, delta = 40, personality = 0 },
]

[[interaction]]
name = "Turn Off Light"
action = "TurnOffLamp"
guard = "CanTurnOffLamp"
autonomy = 15
attenuation = 0.02

[[interaction]]
name = "Enjoy Warm Light"
action = "EnjoyLamp"
guard = "CanEnjoyLamp"
autonomy = 30
attenuation = 0.02
motives = [
    { motive = "room", min = -100, delta = 45, personality = 0 },
]

[[slot]]
kind = 3
offset = [0.0, -0.65, 0.0]
standing = 1
sitting = 0
ground = 1
facing = 0

[[sound]]
id = 1
name = "open_lamp_switch"
preset = "ui_click"

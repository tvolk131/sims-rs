[object]
name = "Open Street Mailbox"
description = "A clean-room curbside mailbox for receiving and paying daily household bills via alter_budget."
guid = 0x7F00_0090
price = 50
attributes = 8
init = "Init"
main = "Main"
scripts = ["behavior.antics"]

[sprite]
shape = "mailbox"
primary_rgb = [72, 108, 148]
accent_rgb = [208, 64, 58]
trim_rgb = [118, 86, 56]

[[interaction]]
name = "Pay Bills"
action = "PayBills"
guard = "CanPayBills"
autonomy = 70
attenuation = 0.02
motives = [
    { motive = "room", min = -100, delta = 25, personality = 0 },
]

[[interaction]]
name = "Check Mail"
action = "CheckMail"
guard = "CanCheckMail"
autonomy = 25
attenuation = 0.02
motives = [
    { motive = "fun", min = -100, delta = 10, personality = 0 },
]

[[slot]]
kind = 3
offset = [0.0, -0.75, 0.0]
standing = 1
sitting = 0
ground = 1
facing = 0

[[sound]]
id = 1
name = "open_mailbox_latch"
preset = "ui_click"

[[sound]]
id = 2
name = "open_bills_paid"
preset = "chime"

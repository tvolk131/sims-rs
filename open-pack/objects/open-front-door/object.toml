[object]
name = "Open Oak Front Door"
description = "A clean-room architectural entry door with knock/welcome social interaction and lock state."
guid = 0x7F00_0080
price = 180
attributes = 8
init = "Init"
main = "Main"
scripts = ["behavior.antics"]

[sprite]
shape = "front_door"
primary_rgb = [136, 86, 52]
accent_rgb = [214, 198, 152]
trim_rgb = [78, 52, 34]

[[interaction]]
name = "Knock and Welcome"
action = "WelcomeGuest"
guard = "CanWelcome"
autonomy = 35
attenuation = 0.02
motives = [
    { motive = "social", min = -100, delta = 40, personality = 0 },
    { motive = "fun", min = -100, delta = 15, personality = 0 },
]

[[interaction]]
name = "Lock Door"
action = "LockDoor"
guard = "CanLockDoor"
autonomy = 10
attenuation = 0.02

[[interaction]]
name = "Unlock Door"
action = "UnlockDoor"
guard = "CanUnlockDoor"
autonomy = 10
attenuation = 0.02

[[slot]]
kind = 3
offset = [0.0, -0.75, 0.0]
standing = 1
sitting = 0
ground = 1
facing = 0

[[sound]]
id = 1
name = "open_door_knock"
preset = "wood_creak"

[[sound]]
id = 2
name = "open_door_bell"
preset = "chime"

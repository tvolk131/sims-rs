# Live sims-vm unit tests for the Open Dining Table: setting and tidying flip `is_set`, each
# offered only in the matching state, and a set table raises its room's score.
#
# The room score adds the object's room impact (data word 7) for the room it stands in. The
# runner's objects stand in no room, so the specs check the word; the score is `sims-sim`'s.

[subject]
antics = "../objects/open-dining-table.antics"
pack = ".."

[sim]

[[test]]
name = "Set Table is offered on a bare table"
guard = "Set Table"
expect = { result = true }

[[test]]
name = "Set Table is not offered on a set table"
guard = "Set Table"
given = { attrs = { is_set = 1 } }
expect = { result = false }

[[test]]
name = "Tidy Table is offered only on a set table"
guard = "Tidy Table"
expect = { result = false }

[[test]]
name = "Set Table is not offered while someone uses the table"
guard = "Set Table"
given = { attrs = { occupied = 1 } }
expect = { result = false }

[[test]]
name = "setting the table raises the room impact"
interaction = "Set Table"
expect = { attrs = { is_set = 1, occupied = 0 }, data = { 7 = 3 }, sounds = ["open_table_tap"] }

[[test]]
name = "tidying the table drops it"
interaction = "Tidy Table"
given = { attrs = { is_set = 1 }, data = { 7 = 3 } }
expect = { attrs = { is_set = 0, occupied = 0 }, data = { 7 = 0 }, sounds = ["open_table_tap"] }

[[test]]
name = "setting takes a tick"
action = "Set Table"
turns = 1
expect = { result = "yield", attrs = { is_set = 0 }, data = { 7 = 0 }, sounds = ["open_table_tap"] }

[[test]]
name = "a set table cannot be set again"
interaction = "Set Table"
given = { attrs = { is_set = 1 }, data = { 7 = 3 } }
expect = { result = "unavailable", data = { 7 = 3 }, sounds = [] }

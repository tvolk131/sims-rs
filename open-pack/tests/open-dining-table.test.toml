# Live sims-vm unit tests for the Open Dining Table: setting and tidying flip `is_set`, each
# offered only in the matching state, and a set table raises its room's score.
#
# The room score adds the object's room impact (data word 7) for the room it stands in. Most
# cases check the word; the last ones stand the table in the runner's counted room (`room =
# true`) and check the room's impact and score, counted again after the table marks its room.

[subject]
antics = "../objects/open-dining-table.antics"
pack = ".."

[lot]
also = ["../objects/open-trash-can.antics"]

[sim]

[[test]]
name = "Set Table is offered on a bare table"
guard = "Set Table"
expect = { result = true }

[[test]]
name = "Set Table is not offered on a set table"
guard = "Set Table"
given = { attrs = { is_set = 1 } }
expect = { result = false }

[[test]]
name = "Tidy Table is offered only on a set table"
guard = "Tidy Table"
expect = { result = false }

[[test]]
name = "Set Table is not offered while someone uses the table"
guard = "Set Table"
given = { attrs = { occupied = 1 } }
expect = { result = false }

[[test]]
name = "setting the table raises the room impact"
interaction = "Set Table"
expect = { attrs = { is_set = 1, occupied = 0 }, data = { 7 = 3 }, sounds = ["open_table_tap"] }

[[test]]
name = "tidying the table drops it"
interaction = "Tidy Table"
given = { attrs = { is_set = 1 }, data = { 7 = 3 } }
expect = { attrs = { is_set = 0, occupied = 0 }, data = { 7 = 0 }, sounds = ["open_table_tap"] }

[[test]]
name = "setting takes a tick"
action = "Set Table"
turns = 1
expect = { result = "yield", attrs = { is_set = 0 }, data = { 7 = 0 }, sounds = ["open_table_tap"] }

[[test]]
name = "a set table cannot be set again"
interaction = "Set Table"
given = { attrs = { is_set = 1 }, data = { 7 = 3 } }
expect = { result = "unavailable", data = { 7 = 3 }, sounds = [] }

[[test]]
name = "setting a placed table raises its room's score"
interaction = "Set Table"
room = true
expect = { attrs = { is_set = 1 }, room = { impact = 3, objects = 1, score = -29.333332 } }

[[test]]
name = "tidying a placed table drops its room's score"
interaction = "Tidy Table"
room = true
given = { attrs = { is_set = 1 }, data = { 7 = 3 } }
expect = { attrs = { is_set = 0 }, room = { impact = 0, objects = 1, score = -30 } }

[[test]]
name = "a placed table counts with the objects beside it"
interaction = "Set Table"
room = true
given = { create = [{ object = "open-trash-can", place = [5, 4] }] }
expect = { room = { impact = 2, objects = 2, score = -29.555557 } }

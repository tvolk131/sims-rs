# Live sims-vm unit tests for the Open Wall Phone: dialog answers, funds, and the fridge
# it restocks.

[subject]
antics = "../objects/open-wall-phone.antics"
pack = ".."

[lot]
also = [{ antics = "../objects/open-fridge.antics", pack = ".." }]

[sim]
motives = { social = 0, fun = 0, comfort = 0 }

[[test]]
name = "ordering groceries with enough money debits $40"
interaction = "Order Groceries"
answers = [1]
given = { funds = 100, create = ["open-fridge"] }
expect = { funds = 60, attrs = { last_outcome = 1, completed_calls = 1 }, dialogs = ["yes_no"], sounds = ["open_phone_dial", "open_phone_confirm"], sim = { motives = { comfort = 10 } } }

[[test]]
name = "ordering groceries without the money changes nothing"
interaction = "Order Groceries"
answers = [1]
given = { funds = 10 }
expect = { funds = 10, attrs = { last_outcome = 5, completed_calls = 0 }, sounds = ["open_phone_dial"] }

[[test]]
name = "cancelling the order"
interaction = "Order Groceries"
answers = [2]
given = { funds = 100 }
expect = { funds = 100, attrs = { last_outcome = 4 }, dialogs = ["yes_no"] }

[[test]]
name = "chatting with a neighbour"
interaction = "Use Phone"
answers = [2]
expect = { attrs = { last_outcome = 2, completed_calls = 1, occupied = 0 }, dialogs = ["yes_no_cancel"], sim = { motives = { social = 35, fun = 15 } }, sounds = ["open_phone_ring", "open_phone_dial", "open_phone_confirm"] }

[[test]]
name = "community info shows an inform dialog"
interaction = "Use Phone"
answers = [3]
expect = { attrs = { last_outcome = 3 }, dialogs = ["yes_no_cancel", "ok"], sim = { motives = { fun = 10 } } }

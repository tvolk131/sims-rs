# Live sims-vm unit tests for the Open Floor Lamp: it starts lit, the switch entries are offered
# by power state, and the switch sets the graphic, the room impact and the light.
#
# A lit lamp raises Room the way the room score does it: through the object's room impact (data
# word 7), which every room update adds to the score of the room the lamp stands in. It is a light
# source (`flags2` `LightSource`, data word 40 bit 0x400), so the room count also adds its light
# (`self.light`, data word 51) to the room's lamp light. The last cases stand the lamp in the
# runner's counted room (`room = true`) and check the room itself: its light sources, lamp light,
# impact, light and score, counted again after the switch marks the room.

[subject]
antics = "../objects/open-floor-lamp.antics"
pack = ".."

[sim]

[[test]]
name = "a new lamp is a lit light source and lights its room"
tree = "Init"
expect = { result = true, attrs = { power = 1, occupied = 0 }, data = { 7 = 5, 40 = 1024, 51 = 50 } }

[[test]]
name = "a lit lamp offers Turn Off Light"
guard = "Turn Off Light"
expect = { result = true }

[[test]]
name = "a lit lamp does not offer Turn On Light"
guard = "Turn On Light"
expect = { result = false }

[[test]]
name = "a dark lamp offers Turn On Light"
guard = "Turn On Light"
given = { attrs = { power = 0 } }
expect = { result = true }

[[test]]
name = "turning the light off shows the dark lamp and drops the room impact and the light"
interaction = "Turn Off Light"
given = { data = { 0 = 0, 7 = 5, 51 = 50 } }
expect = { attrs = { power = 0 }, data = { 0 = 1, 7 = 0, 40 = 1024, 51 = 0 }, sounds = ["open_lamp_switch"] }

[[test]]
name = "turning the light on shows the lit lamp and raises the room impact and the light"
interaction = "Turn On Light"
given = { attrs = { power = 0 }, data = { 0 = 1, 7 = 0, 51 = 0 } }
expect = { attrs = { power = 1 }, data = { 0 = 0, 7 = 5, 40 = 1024, 51 = 50 }, sounds = ["open_lamp_switch"] }

[[test]]
name = "a lit lamp cannot be turned on again"
interaction = "Turn On Light"
expect = { result = "unavailable", data = { 7 = 5, 51 = 50 }, sounds = [] }

[[test]]
name = "a new lamp lights the room it stands in"
room = true
tree = "Init"
expect = { result = true, room = { light_sources = 1, lamp_light = 50, impact = 5, objects = 1, light = 0.234375, score = -19.51389 } }

[[test]]
name = "turning the light off darkens the room"
room = true
interaction = "Turn Off Light"
expect = { room = { light_sources = 1, lamp_light = 0, impact = 0, objects = 1, light = 0, score = -30 } }

[[test]]
name = "turning the light on lights the room again"
room = true
interaction = "Turn On Light"
given = { attrs = { power = 0 }, data = { 0 = 1, 7 = 0, 51 = 0 } }
expect = { attrs = { power = 1 }, room = { light_sources = 1, lamp_light = 50, impact = 5, light = 0.234375, score = -19.51389 } }

# Live sims-vm unit tests for the Open Street Mailbox: bills and the household budget. While a
# bill is unpaid the mailbox's room impact (data word 7) is -4, which the room score adds for the
# lot it stands on; the runner's objects stand in no room, so the specs check the word.

[subject]
antics = "../objects/open-mailbox.antics"
pack = ".."

[sim]
motives = { fun = 0 }

[[test]]
name = "a new mailbox holds one bill"
tree = "Init"
expect = { result = true, attrs = { unpaid_bills = 1, paid_bills = 0 }, data = { 7 = -4 } }

[[test]]
name = "bills cannot be paid without the money"
guard = "Pay Bills"
given = { funds = 50 }
expect = { result = false }

[[test]]
name = "bills can be paid with the money"
guard = "Pay Bills"
given = { funds = 75 }
expect = { result = true }

[[test]]
name = "paying the last bill debits the budget and lifts the room impact"
interaction = "Pay Bills"
given = { funds = 500, data = { 7 = -4 } }
expect = { funds = 425, attrs = { unpaid_bills = 0, paid_bills = 1 }, data = { 7 = 0 }, sounds = ["open_mailbox_latch", "open_bills_paid"] }

[[test]]
name = "there is nothing to pay once the bills are paid"
interaction = "Pay Bills"
given = { funds = 500, attrs = { unpaid_bills = 0 } }
expect = { result = "unavailable", funds = 500 }

[[test]]
name = "checking the mail brings a new bill"
interaction = "Check Mail"
given = { attrs = { unpaid_bills = 0 }, data = { 7 = 0 } }
expect = { attrs = { unpaid_bills = 1 }, data = { 7 = -4 }, sim = { motives = { fun = 8 } }, sounds = ["open_mailbox_latch"] }

[[test]]
name = "the main loop idles"
tree = "Main"
turns = 4
expect = { result = "yield" }

# Determinism rules for simulation code (docs/vision.md, "Floating-point math
# policy"). Platform math functions differ between machines; use the `libm`
# crate, through the simulation float wrapper in sims-core, instead.
disallowed-methods = [
    { path = "f32::sin", reason = "platform math; use libm via sims_core" },
    { path = "f32::cos", reason = "platform math; use libm via sims_core" },
    { path = "f32::tan", reason = "platform math; use libm via sims_core" },
    { path = "f32::sin_cos", reason = "platform math; use libm via sims_core" },
    { path = "f32::asin", reason = "platform math; use libm via sims_core" },
    { path = "f32::acos", reason = "platform math; use libm via sims_core" },
    { path = "f32::atan", reason = "platform math; use libm via sims_core" },
    { path = "f32::atan2", reason = "platform math; use libm via sims_core" },
    { path = "f32::exp", reason = "platform math; use libm via sims_core" },
    { path = "f32::exp2", reason = "platform math; use libm via sims_core" },
    { path = "f32::exp_m1", reason = "platform math; use libm via sims_core" },
    { path = "f32::ln", reason = "platform math; use libm via sims_core" },
    { path = "f32::ln_1p", reason = "platform math; use libm via sims_core" },
    { path = "f32::log", reason = "platform math; use libm via sims_core" },
    { path = "f32::log2", reason = "platform math; use libm via sims_core" },
    { path = "f32::log10", reason = "platform math; use libm via sims_core" },
    { path = "f32::powf", reason = "platform math; use libm via sims_core" },
    { path = "f32::powi", reason = "not guaranteed bit-exact across platforms" },
    { path = "f32::cbrt", reason = "platform math; use libm via sims_core" },
    { path = "f32::hypot", reason = "platform math; use libm via sims_core" },
    { path = "f32::sinh", reason = "platform math; use libm via sims_core" },
    { path = "f32::cosh", reason = "platform math; use libm via sims_core" },
    { path = "f32::tanh", reason = "platform math; use libm via sims_core" },
    { path = "f64::sin", reason = "platform math; use libm via sims_core" },
    { path = "f64::cos", reason = "platform math; use libm via sims_core" },
    { path = "f64::tan", reason = "platform math; use libm via sims_core" },
    { path = "f64::sin_cos", reason = "platform math; use libm via sims_core" },
    { path = "f64::asin", reason = "platform math; use libm via sims_core" },
    { path = "f64::acos", reason = "platform math; use libm via sims_core" },
    { path = "f64::atan", reason = "platform math; use libm via sims_core" },
    { path = "f64::atan2", reason = "platform math; use libm via sims_core" },
    { path = "f64::exp", reason = "platform math; use libm via sims_core" },
    { path = "f64::exp2", reason = "platform math; use libm via sims_core" },
    { path = "f64::exp_m1", reason = "platform math; use libm via sims_core" },
    { path = "f64::ln", reason = "platform math; use libm via sims_core" },
    { path = "f64::ln_1p", reason = "platform math; use libm via sims_core" },
    { path = "f64::log", reason = "platform math; use libm via sims_core" },
    { path = "f64::log2", reason = "platform math; use libm via sims_core" },
    { path = "f64::log10", reason = "platform math; use libm via sims_core" },
    { path = "f64::powf", reason = "platform math; use libm via sims_core" },
    { path = "f64::powi", reason = "not guaranteed bit-exact across platforms" },
    { path = "f64::cbrt", reason = "platform math; use libm via sims_core" },
    { path = "f64::hypot", reason = "platform math; use libm via sims_core" },
    { path = "f64::sinh", reason = "platform math; use libm via sims_core" },
    { path = "f64::cosh", reason = "platform math; use libm via sims_core" },
    { path = "f64::tanh", reason = "platform math; use libm via sims_core" },
    { path = "std::time::Instant::now", reason = "no wall clock in simulation code" },
    { path = "std::time::SystemTime::now", reason = "no wall clock in simulation code" },
    { path = "std::thread::sleep", reason = "simulation code never waits on time" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order can leak into state; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order can leak into state; use BTreeSet" },
]

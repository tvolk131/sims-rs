name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p test_check_repository.py
      - run: python3 -B scripts/check_repository.py
      - run: python3 -B scripts/check_repository.py --history HEAD

  rust:
    # The two runners are different architectures (x86_64 and aarch64), so
    # the float-model tests double as a cross-architecture determinism check.
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - run: cargo +1.99.0 fmt --all --check
      - run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --workspace

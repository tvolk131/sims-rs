[workspace]
# The re-founded engine. Code under legacy/ is reference material only; it is
# not part of this workspace and is never built. See docs/vision.md and
# docs/salvage-audit.md.
members = [
    "crates/sims-cli",
    "crates/sims-content",
    "crates/sims-core",
    "crates/sims-formats",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tvolk131/sims-rs"

[workspace.dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sims-content = { path = "crates/sims-content" }
sims-core = { path = "crates/sims-core" }
sims-formats = { path = "crates/sims-formats" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Determinism bans (docs/vision.md "Simulation"). The method and type lists
# live in clippy.toml. Crates that never feed simulation state (rendering,
# audio, the app shell) may allow these explicitly at their crate root.
disallowed_methods = "deny"
disallowed_types = "deny"

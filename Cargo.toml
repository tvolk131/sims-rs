[workspace]
members = [
    "crates/sims-formats",
    "crates/sims-content",
    "crates/sims-vm",
    "crates/sims-sim",
    "crates/sims-runtime",
    "crates/sims-render",
    "crates/sims-app",
    "crates/sims-tools",
    "crates/sims-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tvolk131/sims-rs"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tga"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sims-formats = { path = "crates/sims-formats" }
sims-content = { path = "crates/sims-content" }
sims-vm = { path = "crates/sims-vm" }
sims-sim = { path = "crates/sims-sim" }
sims-runtime = { path = "crates/sims-runtime" }
